name: Idea
description: Propose an improvement to an existing skill (new skills are out of scope; see SCOPE.md).
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read `SCOPE.md` first. An idea stays open only if it describes an observed failure in a real engagement, not a hypothetical improvement, and does not match anything in `.out-of-scope/`.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which existing skill this would change.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What you observed
      description: The real engagement where the current behavior fell short, with enough detail to reproduce it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
