name: Idea
description: Propose an improvement to an existing skill.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        An idea stays open only if it describes an observed failure in a real engagement, not a hypothetical improvement.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which existing skill this would change.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What you observed
      description: The real engagement where the current behavior fell short, with enough detail to reproduce it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
